### YamlMime:Dashboard
title: Packages
description: |
  Pudu packages for documentation sites. pudu-lang-docgen builds the site; the other two are the
  packages it is built on, and each can be used on its own.
defaults:
  author: Chris Michael
  license: Apache-2.0
  type: Package
items:
- name: pudu-lang-docgen
  description: |
    Documentation publishing for Pudu: articles, API reference from Pudu sources and OpenAPI
    descriptions, navigation, cross references, search, and static websites. Its modules live
    under `PuduLangDocgen`; start with the <xref:PuduLangDocgen?text=API+reference>.
  homepage: ../guides/introduction.md
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-docgen
  usage:
    install: pudu install @chrismichaelps/pudu-lang-docgen
    init: import PuduLangDocgen.Command as Command
- name: pudu-lang-log
  description: |
    Structured event logging with message templates, levels, enrichers, filters, and sinks. The
    docgen command line reports its diagnostics through it, so `--logLevel` and `--log` apply to
    every message.
  homepage: https://github.com/chrismichaelps/pudu-lang-log
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-log
  usage:
    install: pudu install @chrismichaelps/pudu-lang-log
- name: pudu-lang-validator
  description: |
    Typed validation rules that report every failure with its property path. docgen checks the
    relations inside `docgen.json` with it.
  homepage: https://github.com/chrismichaelps/pudu-lang-validator
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-validator
  usage:
    install: pudu install @chrismichaelps/pudu-lang-validator
