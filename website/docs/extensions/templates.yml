### YamlMime:Dashboard
title: Templates
description: |
  Templates decide how every page looks. The templates below are built into pudu-lang-docgen
  and are selected by name in `build.template`. Template folders of your own are listed after
  them to override partials and add styles; see [Templates and theming](../guides/templates.md).
defaults:
  type: Template
items:
- name: default
  description: |
    The standard look: a responsive layout with light, dark, and automatic color themes, a
    header with search, a filterable sidebar, breadcrumbs, an article outline, previous and
    next links, and print styles. Its layout and partials can be exported and overridden.
  homepage: ../guides/templates.md
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-docgen/blob/main/src/PuduLangDocgen/Theme/Layout.pudu
  usage:
    config: '"template": ["default", "template"]'
    command: docgen template export template
- name: modern
  description: |
    Another name for `default`, accepted so that configurations that name it keep working.
    It renders exactly like `default`.
  homepage: ../guides/commands/template.md
  usage:
    config: '"template": ["modern"]'
- name: rest.tagpage
  type: Template extension
  description: |
    Publishes each OpenAPI description as an overview page with servers, an operation index,
    and schemas, plus one page per tag.
  homepage: ../guides/http-api.md
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-docgen/blob/main/src/PuduLangDocgen/Rest/Pages.pudu
  usage:
    config: '"template": ["default", "rest.tagpage"]'
- name: rest.operationpage
  type: Template extension
  description: |
    Publishes one page per operation. Combine it with `rest.tagpage` for tag pages that link to
    operation pages.
  homepage: ../guides/http-api.md
  repository:
    url: https://github.com/chrismichaelps/pudu-lang-docgen/blob/main/src/PuduLangDocgen/Rest/Pages.pudu
  usage:
    config: '"template": ["default", "rest.tagpage", "rest.operationpage"]'
