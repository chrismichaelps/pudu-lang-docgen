### YamlMime:Landing
title: Pudu Documentation Generator
summary: Publish documentation for Pudu projects. Write articles in Markdown, generate reference pages from the public declarations of your Pudu modules and from OpenAPI descriptions, and ship one static website with navigation, cross references, search, and printable PDF documents. This site is built with it.
metadata:
  uid: home
  description: Turn Markdown articles, Pudu source declarations, and OpenAPI descriptions into a searchable static documentation website.

